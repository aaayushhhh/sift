[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sift-research"
version = "0.1.0"
description = "Multi-agent research and evidence verification with LangGraph"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=0.6,<2",
  "langchain-core>=0.3,<2",
  "langchain-openai>=0.3,<2",
  "langsmith>=0.4,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "scikit-learn>=1.5,<2",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "streamlit>=1.40,<2",
  "python-dotenv>=1.0,<2",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.7,<1"]

[project.scripts]
sift = "sift.cli:main"

[tool.setuptools.packages.find]
include = ["sift*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
